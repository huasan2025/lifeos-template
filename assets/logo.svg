<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="ui-serif, Georgia, serif">
  <defs>
    <style><![CDATA[
      @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes fadeUpRight { 0% { opacity: 0; transform: translate(-15px, 20px); } 100% { opacity: 1; transform: translate(0, 0); } }
      @keyframes drawLine { 0% { stroke-dashoffset: 240; } 100% { stroke-dashoffset: 0; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes floatWhole { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .logo-main { animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s backwards; }
      .logo-sub  { animation: fadeUpRight 1.1s cubic-bezier(0.16,1,0.3,1) 0.7s backwards; }
      .divider { stroke-dasharray: 240; animation: drawLine 1.1s cubic-bezier(0.25,0.46,0.45,0.94) 1.1s backwards; }
      .tagline { animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 1.5s backwards; }
      .term-cursor { animation: blink 1s steps(1) 0.5s infinite; }
      .logo-float { animation: floatWhole 6s ease-in-out 2.4s infinite; transform-origin: center; }
    ]]></style>
  </defs>
  <rect width="1200" height="400" fill="#fefcf7"/>
  <path d="M 30 60 L 30 30 L 60 30" stroke="#e7d4a8" stroke-width="1" fill="none"/>
  <path d="M 1170 60 L 1170 30 L 1140 30" stroke="#e7d4a8" stroke-width="1" fill="none"/>
  <path d="M 30 340 L 30 370 L 60 370" stroke="#e7d4a8" stroke-width="1" fill="none"/>
  <path d="M 1170 340 L 1170 370 L 1140 370" stroke="#e7d4a8" stroke-width="1" fill="none"/>
  <g class="logo-float">
    <text class="logo-main" x="140" y="200" font-size="98" font-weight="700" font-style="italic" fill="#1f2937">lifeos</text>
    <text class="logo-sub" x="270" y="263" font-size="46" font-style="italic" fill="#d97706">— template</text>
    <line class="divider" x1="140" y1="293" x2="380" y2="293" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text class="tagline" x="140" y="330" font-size="17" fill="#6b4423" font-style="italic">Your AI assistant + self-evolving life OS</text>
  </g>
  <g>
    <rect x="580" y="110" width="520" height="210" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <rect x="580" y="110" width="520" height="32" rx="10" fill="#334155"/>
    <rect x="580" y="132" width="520" height="10" fill="#334155"/>
    <circle cx="600" cy="126" r="5" fill="#ef4444"/>
    <circle cx="618" cy="126" r="5" fill="#f59e0b"/>
    <circle cx="636" cy="126" r="5" fill="#22c55e"/>
    <text x="840" y="131" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="ui-monospace, monospace">lifeos — claude</text>
    <text x="600" y="185" font-size="18" font-family="ui-monospace, monospace" fill="#4ade80">$</text>
    <text x="620" y="185" font-size="18" font-family="ui-monospace, monospace" fill="#e2e8f0">/go</text>
    <text x="600" y="220" font-size="14" font-family="ui-monospace, monospace" fill="#4ade80">→</text>
    <text x="620" y="220" font-size="14" font-family="ui-monospace, monospace" fill="#86efac">今天最该做：</text>
    <text x="620" y="245" font-size="14" font-family="ui-monospace, monospace" fill="#bbf7d0">1. 发推 #2 + demo</text>
    <text x="620" y="267" font-size="14" font-family="ui-monospace, monospace" fill="#bbf7d0">2. 找 3 个用户试用</text>
    <text x="620" y="289" font-size="14" font-family="ui-monospace, monospace" fill="#bbf7d0">3. 拆 1 个 landing</text>
    <rect class="term-cursor" x="772" y="277" width="3" height="16" fill="#4ade80"/>
  </g>
</svg>